<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>三层五子棋 · 规则</title>
  <link rel="stylesheet" href="/style.css?v=11" />
  <link rel="stylesheet" href="/rules.css?v=3" />
</head>
<body class="rules-page">
  <header class="rules-top">
    <a class="rules-back" id="rules-back" href="/">← 返回游戏</a>
    <h1>三层五子棋 · 规则</h1>
  </header>
  <main id="rules-main" class="rules-main"></main>
  <script>
    (function () {
      const back = document.getElementById('rules-back');
      try {
        const ref = document.referrer ? new URL(document.referrer) : null;
        if (ref && ref.origin === location.origin && !ref.pathname.endsWith('/rules.html')) {
          back.href = ref.pathname + ref.search + ref.hash || '/';
        }
      } catch (_) { /* keep / */ }
    })();
  </script>
  <script type="module" src="/rules.js?v=3"></script>
</body>
</html>
