<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>三层五子棋</title>
  <link rel="stylesheet" href="/style.css?v=10" />
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>三层五子棋</h1>
      <p class="subtitle">点空位落子 · 点己方棋子移动</p>
      <p class="nav-links"><a href="/rules.html" target="_blank" rel="noopener">规则</a></p>
    </header>

    <section id="lobby" class="lobby">
      <div class="lobby-actions">
        <button type="button" id="btn-create">创建房间</button>
        <button type="button" id="btn-join">加入房间</button>
      </div>
      <p id="lobby-status" class="lobby-status">连接中…</p>
      <div id="seats" class="seats" hidden>
        <div class="seat" id="seat-a"><span class="seat-label">先手（深色）</span><span class="seat-who" id="seat-a-who">空</span></div>
        <div class="seat" id="seat-b"><span class="seat-label">后手（浅色）</span><span class="seat-who" id="seat-b-who">空</span></div>
      </div>
      <div id="invite-box" class="invite-box" hidden>
        <input id="invite-url" readonly />
        <button type="button" id="btn-copy-invite">复制邀请链接</button>
        <p id="invite-hint" class="invite-hint"></p>
      </div>
      <div id="ready-actions" class="ready-actions" hidden>
        <button type="button" id="btn-swap">交换先手后手</button>
        <button type="button" id="btn-start">开始对局</button>
      </div>
      <p id="lan-hint" class="lan-hint" hidden></p>
    </section>

    <section id="game" class="game" hidden>
      <div class="status-bar">
        <div class="status-row">
          <span id="phase-label">—</span>
          <span id="you-label"></span>
          <a href="/rules.html" class="rules-link" target="_blank" rel="noopener">规则</a>
        </div>
        <div class="status-row">
          <span id="current-label">—</span>
          <button type="button" id="btn-undo" class="btn-undo" hidden>悔棋</button>
        </div>
        <div class="status-row hands">
          <span id="hand-a">A 手棋：25</span>
          <span id="hand-b">B 手棋：25</span>
        </div>
        <p id="hint-label" class="hint-label"></p>
        <p id="message" class="message" aria-live="polite"></p>
      </div>
      <p id="your-turn-banner" class="your-turn-banner" hidden aria-live="polite">现在轮到你了</p>

      <div class="play-layout">
        <aside class="taunt-rail taunt-rail-left" aria-label="左侧嘲讽">
          <button type="button" class="taunt-btn" data-taunt="你这个臭棋篓子">你这个臭棋篓子</button>
          <button type="button" class="taunt-btn" data-taunt="我等的花儿都谢了">我等的花儿都谢了</button>
          <div class="taunt-sky" id="taunt-sky-left"></div>
        </aside>

        <div class="play-center">
          <div class="board-wrap" id="board-wrap">
            <canvas id="board" width="920" height="820" aria-label="棋盘"></canvas>
            <div id="end-overlay" class="end-overlay" hidden>
              <p id="end-title" class="end-title"></p>
              <p id="end-reason" class="end-reason"></p>
              <button type="button" id="btn-restart">再来一局</button>
            </div>
          </div>
          <div id="replay-bar" class="replay-bar" hidden>
            <label class="replay-label" for="replay-slider">复盘</label>
            <input type="range" id="replay-slider" min="0" max="0" value="0" />
            <span id="replay-step" class="replay-step">0/0</span>
          </div>
        </div>

        <aside class="taunt-rail taunt-rail-right" aria-label="右侧嘲讽">
          <button type="button" class="taunt-btn" data-taunt="你这个臭棋篓子">你这个臭棋篓子</button>
          <button type="button" class="taunt-btn" data-taunt="我等的花儿都谢了">我等的花儿都谢了</button>
          <div class="taunt-sky" id="taunt-sky-right"></div>
        </aside>
      </div>
    </section>
  </main>

  <div id="undo-plea" class="undo-plea" hidden>
    <div class="undo-plea-card">
      <p id="undo-plea-text" class="undo-plea-text">求你啦爸爸让让我😭</p>
      <p id="undo-plea-from" class="undo-plea-from"></p>
      <div class="undo-plea-actions">
        <button type="button" id="btn-undo-accept" hidden>同意</button>
        <button type="button" id="btn-undo-dismiss">知道了</button>
      </div>
    </div>
  </div>

  <div id="taunt-layer" class="taunt-layer" aria-hidden="true"></div>

  <script type="module" src="/client.js?v=10"></script>
</body>
</html>
